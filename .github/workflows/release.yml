name: Release & CurseForge Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GuildMarket ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            GuildMarket.lua
            GuildMarket.toc
            GuildMarket_BCC.toc
            GuildMarket_Vanilla.toc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.gmarketAddon }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CURSE_RELEASE_TYPE: beta
